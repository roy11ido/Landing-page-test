<title>מסלול נדל״ן ארה״ב</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky ledger-style tab bar, single reading column (max 1080px), cards only for interactive objects */
:root {
  --bg: #F2F4F6;
  --surface: #FFFFFF;
  --surface-2: #E9EDF1;
  --ink: #15212C;
  --muted: #5A6774;
  --line: #D6DDE4;
  --accent: #1D4C86;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1E9F4;
  --good: #1D7449;
  --good-soft: #E0F1E8;
  --warn: #9C6208;
  --warn-soft: #FBEFD9;
  --bad: #B0281F;
  --bad-soft: #FBE3E1;
  --font-display: "Frank Ruhl Libre", "David", "Times New Roman", serif;
  --font-body: "IBM Plex Sans Hebrew", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141A; --surface: #161F28; --surface-2: #1E2933; --ink: #E5ECF2; --muted: #9AA7B4; --line: #2B3844;
    --accent: #86ADE3; --accent-ink: #0E141A; --accent-soft: #1B2B40;
    --good: #5FC491; --good-soft: #15302A; --warn: #E2AA4D; --warn-soft: #33281A; --bad: #F0817A; --bad-soft: #3A1E1F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141A; --surface: #161F28; --surface-2: #1E2933; --ink: #E5ECF2; --muted: #9AA7B4; --line: #2B3844;
  --accent: #86ADE3; --accent-ink: #0E141A; --accent-soft: #1B2B40;
  --good: #5FC491; --good-soft: #15302A; --warn: #E2AA4D; --warn-soft: #33281A; --bad: #F0817A; --bad-soft: #3A1E1F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { direction: rtl; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 900; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 700; font-family: var(--font-body); }
p { margin: 0; }
a { color: var(--accent); }
.num, .ltr { font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.en { direction: ltr; unicode-bidi: isolate; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 4px; }
.brand-name { font-family: var(--font-display); font-weight: 900; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.seal { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--accent); }
.mini-progress { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.mini-bar { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.mini-bar i { display: block; height: 100%; background: var(--accent); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 10px 12px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

main { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; gap: 28px; }
.stack { display: grid; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.note { border-inline-start: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 14px; }
.note.info { border-color: var(--accent); background: var(--accent-soft); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.bar.good i { background: var(--good); }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: start; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; font-size: 13px; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.term { font-weight: 600; white-space: nowrap; direction: ltr; unicode-bidi: isolate; text-align: right; }
td.n, th.n { text-align: left; font-family: var(--font-mono); font-variant-numeric: tabular-nums; direction: ltr; white-space: nowrap; }

/* home */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: stretch; }
.hero-main { display: grid; gap: 12px; align-content: start; }
.week-big { font-family: var(--font-mono); font-size: 3.4rem; font-weight: 600; line-height: 1; color: var(--accent); }
.phases { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.phase { border-top: 4px solid var(--line); padding-top: 8px; font-size: 13px; min-width: 0; }
.phase b { display: block; font-size: 13px; }
.phase .muted { font-size: 12px; }
.phase.done { border-color: var(--good); }
.phase.now { border-color: var(--accent); }
.method { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; counter-reset: m; }
.method div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; font-size: 14px; min-width: 0; }
.method div::before { counter-increment: m; content: counter(m); font-family: var(--font-mono); color: var(--accent); font-weight: 600; display: block; }
.mods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mod-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 8px; cursor: pointer; text-align: start; min-width: 0; }
.mod-card:hover { border-color: var(--accent); }
.mod-card .mn { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.mod-card h3 { font-family: var(--font-display); font-size: 1.1rem; }
.mod-card.current { box-shadow: 0 0 0 2px var(--accent); }

/* module */
.mod-head { display: grid; gap: 10px; }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.subtab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 500; }
.subtab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.steps { margin: 0; padding-inline-start: 22px; display: grid; gap: 6px; }
.steps li::marker { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
ul.plain { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; }
.formula { font-family: var(--font-mono); direction: ltr; text-align: left; background: var(--surface-2); padding: 10px 14px; border-radius: 8px; font-size: 14px; overflow-x: auto; }
.tasks { display: grid; gap: 8px; }
.task { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.task input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--good); flex: none; }
.task.done span.t { color: var(--muted); text-decoration: line-through; }
.task .t { flex: 1; min-width: 0; }
.exam { border: 1px dashed var(--accent); border-radius: var(--r); padding: 14px; background: var(--accent-soft); display: grid; gap: 8px; }

/* flashcards */
.fc-wrap { display: grid; gap: 14px; justify-items: center; }
.fc { width: min(560px, 100%); min-height: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: grid; place-items: center; padding: 24px; text-align: center; cursor: pointer; }
.fc .ft { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 600; direction: ltr; }
.fc .fb { font-size: 1.05rem; max-width: 46ch; }
.fc .fx { margin-top: 10px; font-size: 13px; color: var(--muted); }

/* quiz */
.q { display: grid; gap: 8px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.q:last-of-type { border-bottom: 0; }
.q-title { font-weight: 600; }
.q-title .qn { font-family: var(--font-mono); color: var(--muted); margin-inline-end: 6px; }
.opts { display: grid; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; background: var(--surface); }
.opt input { margin-top: 4px; flex: none; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.q-ex { font-size: 13px; color: var(--muted); }
.score { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.score .big { font-family: var(--font-mono); font-size: 2rem; font-weight: 600; }

/* tools */
.tool-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.field { display: grid; gap: 3px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select, textarea, .cell-in { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 10px; width: 100%; min-width: 0; }
.field input[type="number"], .cell-in[type="number"] { font-family: var(--font-mono); direction: ltr; text-align: left; }
.fieldset-title { grid-column: 1 / -1; font-weight: 600; font-size: 13px; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; min-width: 0; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
.kpi.good { border-color: var(--good); }
.kpi.bad { border-color: var(--bad); }
.checks { display: grid; gap: 6px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.good { background: var(--good); }
.dot.bad { background: var(--bad); }
.verdict { padding: 12px 14px; border-radius: var(--r); font-weight: 600; }
.verdict.good { background: var(--good-soft); color: var(--good); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.cell-in { padding: 5px 8px; font-size: 14px; }
.cell-in.sc { width: 64px; }
.tool-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.funnel { display: grid; gap: 8px; }
.funnel-row { display: grid; grid-template-columns: 150px 1fr 70px; gap: 10px; align-items: center; font-size: 14px; }
.funnel-row .bar { height: 14px; }
.example-tag { font-size: 11px; color: var(--warn); font-weight: 600; }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; width: 100%; font-size: 15px; }
.inline-confirm { display: inline-flex; gap: 6px; align-items: center; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 20; }

@media (max-width: 860px) {
  .hero, .tool-grid { grid-template-columns: 1fr; }
  .mods { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .method { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .phases { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 12px; }
}
@media (max-width: 520px) {
  .mods, .fields { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mini-bar { width: 50px; }
  .funnel-row { grid-template-columns: 110px 1fr 56px; }
  .week-big { font-size: 2.6rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  <div class="top-inner">
    <div class="brand">
      <div class="brand-name"><span class="seal">US</span>מסלול נדל״ן ארה״ב</div>

<script>
/* ===================== CONTENT ===================== */
const PHASES = [
  { name: "יסודות", weeks: [1, 3], mods: "1–2", goal: "לדבר בשפה של השוק ולהבין איך זר מקבל מימון" },
  { name: "ניתוח שוק", weeks: [4, 5], mods: "3", goal: "לבחור עיר ו-3 מיקודים לפי נתונים" },
  { name: "ניתוח עסקה", weeks: [6, 10], mods: "4", goal: "לנתח עסקה מלאה לבד (מבחן הסמכה)" },
  { name: "ביצוע וצוות", weeks: [11, 14], mods: "5–6", goal: "לעבור עסקה מהצעה ועד סגירה ולבחור בעלי מקצוע" },
  { name: "שותפים, מס, תפעול", weeks: [15, 18], mods: "7–8", goal: "לבנות שותפות נכונה ולהבין מה קורה אחרי הקנייה" },
  { name: "צנרת חיה", weeks: [19, 24], mods: "9", goal: "למצוא עסקה טובה מתוך עשרות עסקאות" }
];

const MODULES = [
{
  id: "m1", n: 1, title: "המערכת האמריקאית ומושגי יסוד", weeks: [1, 2],
  goal: "להבין איך השוק האמריקאי בנוי ובמה הוא שונה מישראל, כדי שכל מודול אחר ייבנה על בסיס נכון.",
  sections: [
    { type: "terms", title: "סוגי נכסים", rows: [
      ["Single-Family (SFR)", "בית פרטי לבד על מגרש. דייר אחד, פשוט לנהל, אבל אם הדייר עוזב ההכנסה יורדת ל-0."],
      ["Duplex / Triplex / Quadplex", "בניין עם 2/3/4 דירות. נחשב נדל״ן למגורים, ולכן מקבל מימון נוח יחסית."],
      ["Multifamily", "כל בניין עם יותר מדירה אחת. מ-5 יחידות ומעלה נחשב נדל״ן מסחרי, עם כללי מימון ושמאות אחרים."],
      ["Condo", "דירה בבניין משותף, כמו דירה בישראל. משלמים HOA."],
      ["HOA", "ועד בית עם סמכויות: דמי חודש, כללים, ולפעמים איסור על השכרה."],
      ["Class A / B / C / D", "דירוג שכונה או נכס. A = חדש ויוקרתי, B = מעמד ביניים יציב, C = ישן ושכונה חלשה יותר, D = פשיעה גבוהה ודיירים בעייתיים. משקיעים מתחילים מכוונים ל-B ול-B-."]
    ]},
    { type: "terms", title: "שחקנים ומערכות", rows: [
      ["MLS", "מאגר הנכסים המשותף של המתווכים. רוב הנכסים למכירה מופיעים שם, ומשם הם מגיעים ל-Zillow."],
      ["On-Market / Off-Market", "נכס שמפורסם ב-MLS, לעומת נכס שנמכר בשקט דרך קשרים. עסקאות off-market לרוב זולות יותר."],
      ["Listing Agent / Buyer's Agent", "המתווך של המוכר והמתווך של הקונה. בדרך כלל המוכר משלם את העמלה של שניהם."],
      ["Wholesaler", "אדם שמשיג נכס בחוזה במחיר נמוך ומוכר את החוזה לקונה אחר תמורת עמלה. מקור טוב לעסקאות, אבל דורש בדיקה כפולה."],
      ["Turnkey Provider", "חברה שמוכרת נכס משופץ עם דייר ועם ניהול. נוח, אבל לרוב יקר, ויש הרבה משווקים כאלה שפונים לישראלים."],
      ["Property Manager", "חברת ניהול שמוצאת דיירים, גובה שכירות ומטפלת בתיקונים. לרוב גובה 8%–10% מהשכירות."]
    ]},
    { type: "terms", title: "מסים ועלויות קבועות", rows: [
      ["Property Tax", "מס שנתי שבעל הנכס משלם, כאחוז משווי הנכס. באוהיו בערך 1.5%–2.5% (לא בטוח, מאמתים לפי מחוז). ההוצאה הכי גדולה אחרי המשכנתא."],
      ["Reassessment", "שיערוך של המחוז לשווי הנכס, לרוב אחרי מכירה. יכול להעלות את המס. לכן מחשבים מס לפי מחיר הקנייה שלך."],
      ["Landlord Insurance", "ביטוח למשכיר: מבנה, אחריות כלפי צד ג׳ ואובדן שכירות."],
      ["Utilities", "מים, חשמל, גז, ביוב, אשפה. חשוב לדעת מי משלם: הדייר או אתה."]
    ]},
    { type: "terms", title: "חוקי שכירות", rows: [
      ["Lease", "חוזה שכירות, לרוב ל-12 חודשים."],
      ["Security Deposit", "פיקדון של הדייר, לרוב שכירות של חודש."],

const usd = v => isFinite(v) ? (v < 0 ? "-$" : "$") + Math.round(Math.abs(v)).toLocaleString("en-US") : "—";
const pct = (v, d = 1) => isFinite(v) ? v.toFixed(d) + "%" : "—";

const pmt = (loan, ratePct, years) => { const r = ratePct / 100 / 12, n = years * 12; if (!loan) return 0; return r === 0 ? loan / n : loan * r / (1 - Math.pow(1 + r, -n)); };

function currentWeek() {
  const d0 = new Date(S.start + "T00:00:00"), now = new Date();
  const w = Math.floor((now - d0) / (7 * 864e5)) + 1;
  return Math.max(1, Math.min(24, w));
}
function moduleForWeek(w) { return MODULES.find(m => w >= m.weeks[0] && w <= m.weeks[1]) || MODULES[MODULES.length - 1]; }
function modStats(m) {
  const done = m.tasks.filter((_, i) => S.tasks[m.id + "-" + i]).length;
  const q = S.quiz[m.id];
  const quizPassed = q && (q.best / q.total * 100) >= m.passPct;
  const examOk = !!S.exam[m.id];
  return { done, total: m.tasks.length, q, quizPassed, examOk, complete: quizPassed && examOk };
}
function overall() {
  let pts = 0, max = 0;
  MODULES.forEach(m => { const s = modStats(m); pts += s.done + (s.quizPassed ? 2 : 0) + (s.examOk ? 2 : 0); max += s.total + 4; });
  return Math.round(pts / max * 100);
}

  const valid = ["home", "tools", "glossary", "backup", ...MODULES.map(m => m.id), ...TOOLS.map(t => t.id)];
  if (!valid.includes(id)) id = "home";
  S.ui.tab = id; save();

  renderTabs(id);
  const app = $("#app");
  if (id === "home") app.innerHTML = viewHome();
  else if (id === "tools") app.innerHTML = viewTools();
  else if (id === "glossary") app.innerHTML = viewGlossary();

  else if (id.startsWith("m")) app.innerHTML = viewModule(MODULES.find(m => m.id === id));
  else app.innerHTML = viewTool(id);
  afterRender(id);
  window.scrollTo(0, 0);
}

/* --- T1 --- */
function renderT1() {
  const v = S.t1;
  ["price", "down", "rate", "years", "points", "closing", "resMonths", "taxIns", "noi", "cash"].forEach(k => v[k] = num("t1" + k));
  const d = v.down / 100, loan = v.price * (1 - d), pi = pmt(loan, v.rate, v.years);
  const downAmt = v.price * d, pts = loan * v.points / 100, clo = v.price * v.closing / 100;
  const ctc = downAmt + pts + clo, piti = pi + v.taxIns, res = v.resMonths * piti, need = ctc + res;
  const dscr = pi ? v.noi / pi : NaN;
  const f = pmt(1, v.rate, v.years);
  const maxP = (v.cash - v.resMonths * v.taxIns) / (d + v.closing / 100 + (v.points / 100) * (1 - d) + v.resMonths * (1 - d) * f);
  const ok = v.cash >= need;
  $("#t1out").innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="k">הלוואה</div><div class="v">${usd(loan)}</div></div>
      <div class="kpi"><div class="k">תשלום חודשי (קרן + ריבית)</div><div class="v">${usd(pi)}</div></div>
      <div class="kpi ${dscr >= 1.25 ? "good" : "bad"}"><div class="k">DSCR</div><div class="v">${fx(dscr)}</div></div>
    </div>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>מקדמה</td><td class="n">${usd(downAmt)}</td></tr>
      <tr><td>נקודות</td><td class="n">${usd(pts)}</td></tr>
      <tr><td>עלויות סגירה</td><td class="n">${usd(clo)}</td></tr>
      <tr><td><b>Cash to Close</b></td><td class="n"><b>${usd(ctc)}</b></td></tr>
      <tr><td>רזרבות (${v.resMonths} × ${usd(piti)} PITI)</td><td class="n">${usd(res)}</td></tr>
      <tr><td><b>סך ההון הנדרש</b></td><td class="n"><b>${usd(need)}</b></td></tr>
    </tbody></table></div>
    <div class="verdict ${ok ? "good" : "bad"}">${ok ? `ההון שלך מספיק. נשאר <span class="num">${usd(v.cash - need)}</span>.` : `חסרים <span class="num">${usd(need - v.cash)}</span> לעסקה הזו.`}</div>
    <div class="card"><span class="eyebrow">תקציב קנייה מקסימלי לפי ההון שלך</span><div class="week-big" style="font-size:2rem;direction:ltr;text-align:right">${usd(maxP)}</div><p class="small muted">כולל מקדמה, נקודות, סגירה ורזרבות. הנחה: מס וביטוח קבועים כפי שהוזנו.</p></div>
    ${dscr < 1.25 ? `<div class="note">DSCR מתחת ל-1.25. רוב הבנקים ידרשו מקדמה גדולה יותר או יסרבו.</div>` : ""}`;
  save();
}

/* --- T3 --- */
function calcDeal(v) {
  const one = (vac, rate) => {
    const gross = v.units * v.rent, vacancy = gross * vac / 100, egi = gross - vacancy;
    const tax = v.price * v.taxPct / 100 / 12, ins = v.ins, mgmt = egi * v.mgmt / 100, maint = gross * v.maint / 100, capex = gross * v.capex / 100;
    const util = v.util, leasing = v.leasing, opex = tax + ins + mgmt + maint + capex + util + leasing, noi = egi - opex;
    const loan = v.price * (1 - v.down / 100), debt = pmt(loan, rate, v.years), cf = noi - debt;
    return { gross, vacancy, egi, tax, ins, mgmt, maint, capex, util, leasing, opex, noi, loan, debt, cf };
  };
  const b = one(v.vac, v.rate), s = one(v.sVac, v.sRate);
  const cash = v.price * v.down / 100 + v.price * v.closing / 100 + b.loan * v.points / 100 + v.repairs;
  return Object.assign(b, { s, cash, cap: b.noi * 12 / v.price * 100, coc: b.cf * 12 / cash * 100, dscr: b.noi / b.debt, sCoc: s.cf * 12 / cash * 100, sDscr: s.noi / s.debt, expRatio: b.opex / b.gross * 100 });
}
function renderT3() {
  const v = S.t3;
  ["price", "units", "rent", "vac", "taxPct", "ins", "mgmt", "maint", "capex", "util", "leasing", "down", "rate", "years", "points", "closing", "repairs", "sVac", "sRate"].forEach(k => v[k] = num("t3" + k));

/* ===================== WIRING ===================== */
function afterRender(id) {
  if (id === "home") $("#startDate").onchange = e => { if (e.target.value) { S.start = e.target.value; save(); go("home"); } };
  if (id.startsWith("m")) {
    const m = MODULES.find(x => x.id === id);
    const app = $("#app");
    app.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => { S.ui.sub[m.id] = b.dataset.sub; save(); go(m.id); });
    app.querySelectorAll("[data-task]").forEach(c => c.onchange = () => { S.tasks[c.dataset.task] = c.checked; c.closest(".task").classList.toggle("done", c.checked); save(); const st = app.querySelector('[data-sub="tasks"]'); const s = modStats(m); st.textContent = `משימות (${s.done}/${s.total})`; });
    app.querySelectorAll("[data-fc]").forEach(b => { const act = () => {
      const st = viewCards.st[m.id], terms = moduleTerms(m), known = new Set(S.known[m.id] || []), pool = terms.filter(t => !known.has(t.t));
      const a = b.dataset.fc;
      if (a === "flip") st.flip = !st.flip;
      else if (a === "yes") { known.add(pool[st.i % pool.length].t); S.known[m.id] = [...known]; st.flip = false; save(); }
      else if (a === "no") { st.i++; st.flip = false; }
      else if (a === "reset") { S.known[m.id] = []; st.i = 0; st.flip = false; save(); }
      go(m.id, false);
    }; b.onclick = act; if (b.dataset.fc === "flip") b.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } }; });
    app.querySelectorAll("[data-q]").forEach(r => r.onchange = () => { viewQuiz.st[m.id].ans[+r.dataset.q] = +r.value; });
    app.querySelectorAll("[data-quiz]").forEach(b => b.onclick = () => {
      const st = viewQuiz.st[m.id];
      if (b.dataset.quiz === "submit") {
        const left = m.quiz.length - Object.keys(st.ans).length;
        if (left > 0) { $("#qLeft").textContent = `נשארו ${left} שאלות בלי תשובה`; return; }
        st.done = true;
        const score = m.quiz.filter((q, i) => st.ans[i] === q.a).length;
        const prev = S.quiz[m.id];
        if (!prev || score > prev.best) S.quiz[m.id] = { best: score, total: m.quiz.length };
        save();
      } else { viewQuiz.st[m.id] = { ans: {}, done: false }; }
      go(m.id, false);
    });
    app.querySelectorAll("[data-exam]").forEach(c => c.onchange = () => { S.exam[c.dataset.exam] = c.checked; save(); go(m.id, false); });
  }
  if (id === "t1") { $("#app").querySelectorAll("#t1f input").forEach(i => i.oninput = renderT1); renderT1(); }
  if (id === "t2") wireT2();
  if (id === "t3") {
    $("#app").querySelectorAll(".tool-grid input").forEach(i => i.oninput = renderT3);
    $("#t3reset").onclick = () => { S.t3 = defaults().t3; save(); go("t3", false); toast("נטענה דוגמת מודול 4"); };
    renderT3();
  }
  if (id === "t4") wireT4();
  if (id === "t5") wireT5();
  if (id === "t6") { renderT6(); $("#t6wrap").addEventListener("change", e => { const k = e.target.dataset.dd; if (k) { S.dd[k] = e.target.checked; save(); renderT6(); } }); }
  if (id === "t7") wireT7();
  if (id === "glossary") { renderGlossary(); $("#gq").oninput = e => renderGlossary(e.target.value); }
  if (id === "backup") {
    $("#bkCopy").onclick = () => {
      const t = $("#bkOut"), manual = () => { t.select(); toast("סמנתי את הטקסט, העתק ידנית"); };
      try { navigator.clipboard.writeText(t.value).then(() => toast("הועתק"), manual); } catch (e) { manual(); }
    };
    $("#bkLoad").onclick = () => { try { const o = JSON.parse($("#bkIn").value); if (typeof o !== "object" || !o.tasks) throw 0; S = Object.assign(defaults(), o); save(); $("#bkMsg").textContent = "שוחזר בהצלחה"; $("#bkMsg").style.color = "var(--good)"; } catch (e) { $("#bkMsg").textContent = "הקוד לא תקין. ודא שהדבקת את כל הטקסט מהייצוא."; $("#bkMsg").style.color = "var(--bad)"; } };
    renderConfirm("bkReset", "מחק את כל ההתקדמות", () => { S = defaults(); save(); go("home"); toast("ההתקדמות אופסה"); });

}
function wireT2() {
  renderT2();
  const w = $("#t2wrap");
  w.onchange = e => {
    const t = e.target, v = S.t2;
    if (t.dataset.w) v.weights[+t.dataset.w] = +t.value;
    else if (t.dataset.s) { const [c, r] = t.dataset.s.split("-").map(Number); v.scores[c][r] = +t.value; }
    else if (t.id && t.id.startsWith("t2n")) v.names[+t.id.slice(3)] = t.value;
    else return;
    save(); renderT2();
  };
  w.oninput = e => { if (e.target.dataset.note) { S.t2.notes[+e.target.dataset.note] = e.target.value; save(); } };
  w.onclick = e => { if (e.target.id === "t2clear") { S.t2.scores = [0, 1, 2].map(() => MARKET_METRICS.map(() => 3)); S.t2.example = false; save(); renderT2(); } };
}
function wireT4() {
  renderT4();
  const w = $("#t4wrap");
  w.onchange = e => {
    const t = e.target, v = S.t4;
    if (t.dataset.it) { const [i, j] = t.dataset.it.split("-").map(Number); v.items[i][j] = j ? +t.value : t.value; v.example = false; }
    else if (t.id === "t4arv") v.arv = +t.value || 0;
    else if (t.id === "t4cont") v.cont = +t.value || 0;
    else return;
    save(); renderT4();
  };
  w.onclick = e => {
    if (e.target.id === "t4add") { S.t4.items.push(["פריט חדש", 1, 0]); save(); renderT4(); }
    const d = e.target.closest("[data-del]"); if (d) { S.t4.items.splice(+d.dataset.del, 1); save(); renderT4(); }
  };
}
function wireT5() {
  renderT5();
  const w = $("#t5wrap");
  w.onclick = e => {
    const r = e.target.closest("[data-role]"); if (r) { S.t5.role = +r.dataset.role; save(); renderT5(); return; }
    if (e.target.id === "t5add") { (S.t5.cands[S.t5.role] ||= []).push({ name: "", s: [3, 3, 3, 3], flag: false, note: "" }); save(); renderT5(); return; }
    const d = e.target.closest("[data-cdel]"); if (d) { S.t5.cands[S.t5.role].splice(+d.dataset.cdel, 1); save(); renderT5(); }
  };
  w.onchange = e => {
    const k = e.target.dataset.c; if (!k) return;
    const [i, f] = k.split("-"), c = S.t5.cands[S.t5.role][+i];
    if (f === "name") c.name = e.target.value; else if (f === "note") c.note = e.target.value; else if (f === "flag") c.flag = e.target.checked; else c.s[+f.slice(1)] = +e.target.value;
    save(); renderT5();
  };
}
function wireT7() {
  renderT7();
  const w = $("#t7wrap");
  w.onsubmit = e => {
    e.preventDefault();
    const g = id => $("#" + id).value.trim();
    S.t7.deals.unshift({ addr: g("d_addr"), zip: g("d_zip"), price: +g("d_price"), units: +g("d_units") || 1, rent: +g("d_rent"), coc: g("d_coc") === "" ? null : +g("d_coc"), note: g("d_note"), status: 0 });
    save(); renderT7(); toast("הנכס נוסף לצנרת");
  };
  w.onchange = e => { const s = e.target.dataset.st; if (s != null) { S.t7.deals[+s].status = +e.target.value; save(); renderT7(); } };
  w.onclick = e => {
    const d = e.target.closest("[data-ddel]"); if (d) { S.t7.deals.splice(+d.dataset.ddel, 1); save(); renderT7(); }
    if (e.target.id === "t7clearEx") { S.t7.deals = S.t7.deals.filter(x => !x.ex); save(); renderT7(); }
  };
}

updateMini();

go(h || S.ui.tab || "home", !!h);

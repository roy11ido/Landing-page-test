<title>US Invest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;500;600;700&display=swap">
<style>
/* Layout: light app shell, one 720px column, fixed bottom nav (5 tabs).
   Off-white page, white cards with soft shadow, green = action/pass, amber = borderline, red = fail/delete only.
   Deliberately single (light) theme: the owner asked for a bright app on every phone setting. */
:root {
  --bg: #F3F6F4;
  --card: #FFFFFF;
  --surface: #FFFFFF;
  --soft: #EEF3F0;
  --soft-2: #DFE7E2;
  --ink: #1C2B24;
  --muted: #56655E;
  --line: #DAE3DE;
  --brand: #15803D;
  --brand-strong: #106B32;
  --brand-ink: #FFFFFF;
  --brand-soft: #E6F4EB;
  --green: #15803D;
  --green-soft: #E6F4EB;
  --yellow: #8F6200;
  --yellow-soft: #FFF3D4;
  --red: #C93030;
  --red-soft: #FCEBEB;
  --inv: #15803D;
  --inv-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(28, 43, 36, .05), 0 4px 16px rgba(28, 43, 36, .06);
  --font-display: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --font-body: "Assistant", "Rubik", "Segoe UI", Arial, sans-serif;
  --r: 18px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { direction: rtl; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.25; text-wrap: balance; color: var(--ink); }
h1 { font-size: 1.65rem; font-weight: 700; }
h2 { font-size: 1.2rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.num { font-family: var(--font-display); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.en { direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }

/* shell */
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; min-height: 58px; }
.topbar .ttl { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; flex: none; color: var(--ink); }
.back svg { width: 20px; height: 20px; }
.chip-pct { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 6px; color: var(--brand-strong); }
main { padding-block: 4px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
.nav { position: fixed; inset: auto 0 0 0; z-index: 8; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(28, 43, 36, .05); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding-block: 6px; }
.nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: 14px; }
.nav button svg { width: 23px; height: 23px; }
.nav button .ic { width: 52px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .2s, transform .12s ease; }
.nav button[aria-current="page"] { color: var(--brand-strong); }
.nav button[aria-current="page"] .ic { background: var(--brand-soft); color: var(--brand); }

/* atoms */
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
/* 3 button types: primary (filled green), secondary (white + green outline: .btn / .btn.dark), quiet (.btn.soft) */
.btn { border: 1.5px solid var(--brand); background: var(--card); color: var(--brand-strong); border-radius: 999px; padding: 11px 20px; font-weight: 600; font-family: var(--font-display); font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); box-shadow: 0 2px 8px rgba(21, 128, 61, .25); }
.btn.dark { background: var(--card); border-color: var(--brand); color: var(--brand-strong); }
.btn.soft { background: var(--soft); border-color: transparent; color: var(--brand-strong); }
.btn.sm { padding: 6px 14px; min-height: 38px; font-size: 14px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--red); border-color: var(--red); background: var(--card); }
.btn.danger.fill { background: var(--red); color: #fff; }
a.btn { text-decoration: none; }
label.btn { cursor: pointer; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--muted); display: grid; place-items: center; font-weight: 700; flex: none; }

/* press feedback: every tappable element shrinks, darkens and ripples */
:is(.btn, .tile, .li, .ctile, .feature, .seg button, .chips button, .opt, .nav button, .dots5 button, .icon-btn, .back, .fc, .task, details > summary, .sel) { transition: transform .12s ease, filter .12s ease, background-color .2s, color .2s, box-shadow .2s; }
:is(.btn, .tile, .li, .ctile, .feature, .seg button, .chips button, .opt:not(:disabled), .dots5 button, .icon-btn, .back, .fc, .task, details > summary, .sel):active { transform: scale(.96); filter: brightness(.95); }
.nav button:active .ic { transform: scale(.88); }
.ripple { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .18; transform: scale(0); animation: ripple .5s ease-out forwards; }
@keyframes ripple { to { transform: scale(2.4); opacity: 0; } }
#app.enter > * { animation: enter .24s ease-out both; }
#app.enter > *:nth-child(2) { animation-delay: .03s; }
#app.enter > *:nth-child(3) { animation-delay: .06s; }
#app.enter > *:nth-child(n+4) { animation-delay: .09s; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* surfaces: white cards on the off-white page; nested fills use --soft */
.card, .tile, .li, .ctile, .tcard, .dcard, .metric, details.term, details.adv, .inp, .kpi, .task, .res, .verdict, .hero, .steps div { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.card { border-radius: var(--r); padding: 18px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 600; background: var(--soft); color: var(--ink); white-space: nowrap; }
.pill.good { background: var(--green-soft); color: var(--green); }
.pill.mid { background: var(--yellow-soft); color: var(--yellow); }
.pill.bad { background: var(--red-soft); color: var(--red); }
.pill.dark { background: var(--brand-soft); color: var(--brand-strong); }
.bar { height: 8px; border-radius: 99px; background: var(--soft-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--brand); transition: width .3s; }
.bar.good i { background: var(--green); }
.seg { display: flex; background: var(--soft); border-radius: 999px; padding: 4px; gap: 2px; overflow-x: auto; scrollbar-width: none; border: 1px solid var(--line); }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; border: 0; background: none; border-radius: 999px; padding: 9px 14px; font-weight: 600; font-family: var(--font-display); font-size: 14px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--brand-strong); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; font-family: var(--font-display); color: var(--ink); }
.chips button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-strong); border-color: var(--brand); }
.ringbox { position: relative; display: inline-grid; place-items: center; flex: none; }
.ringbox .in { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-display); color: var(--ink); }
.ring circle { transition: stroke-dashoffset .5s; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.toast { position: fixed; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; z-index: 20; box-shadow: var(--shadow); animation: toastIn .25s ease-out; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.example-tag { font-size: 12px; font-weight: 700; color: var(--yellow); }
.warnline { background: var(--yellow-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; border: 1px solid #F1DFAE; }

/* home */
.hero { border-radius: 24px; padding: 20px; display: grid; gap: 16px; }
.hero .top { display: flex; gap: 18px; align-items: center; }
.hero .wk { font-family: var(--font-display); font-weight: 700; font-size: 2.5rem; line-height: 1; color: var(--brand-strong); }
.hero .wk small { font-size: 1rem; font-weight: 500; color: var(--muted); }
.weeks { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
.weeks span { height: 10px; border-radius: 3px; background: var(--soft-2); }
.weeks span.done { background: var(--brand); }
.weeks span.now { background: var(--yellow); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { border-radius: var(--r); padding: 16px 12px; display: grid; gap: 8px; justify-items: start; text-align: start; min-width: 0; color: var(--ink); }
.tile svg { width: 26px; height: 26px; color: var(--brand); }
.tile b { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
.tile span { font-size: 13px; color: var(--muted); }
.tile.hi { background: var(--brand-soft); border-color: #BFE3CB; }

/* lists */
.list { display: grid; gap: 8px; }
.li { border-radius: var(--r); padding: 14px 16px; display: flex; align-items: center; gap: 14px; text-align: start; width: 100%; min-width: 0; color: var(--ink); }
.li .nbadge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; background: var(--soft); border: 2px solid var(--line); flex: none; }
.li .nbadge.done { background: var(--green); border-color: var(--green); color: #fff; }
.li .nbadge.now { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-strong); }
.li .body { flex: 1; min-width: 0; display: grid; gap: 3px; }
.li .body b { font-family: var(--font-display); font-weight: 600; }
.li .chev { color: var(--muted); flex: none; }

/* module */
details.term { border-radius: 14px; box-shadow: none; }
details.term summary { list-style: none; padding: 13px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-family: var(--font-display); }
details.term summary::-webkit-details-marker { display: none; }
details.term summary::after { content: "+"; width: 26px; height: 26px; border-radius: 50%; background: var(--soft); color: var(--brand-strong); display: grid; place-items: center; font-weight: 700; flex: none; }
details.term[open] summary::after { content: "−"; background: var(--brand); color: #fff; }
details.term .ans { padding: 0 16px 14px; display: grid; gap: 6px; }
details.term .ex { font-size: 14px; background: var(--soft); border-radius: 10px; padding: 6px 10px; }
.terms { display: grid; gap: 6px; }
.steps { display: grid; gap: 8px; counter-reset: s; }
.steps div { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; box-shadow: none; }
.steps div::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; flex: none; font-size: 14px; }
.bul { display: grid; gap: 6px; }
.bul div { display: flex; gap: 10px; align-items: flex-start; }
.bul div::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); margin-top: 9px; flex: none; }
.bul.warn div::before { background: var(--red); }
.formula { font-family: var(--font-display); direction: ltr; background: var(--brand-soft); color: var(--brand-strong); border-radius: 12px; padding: 10px 14px; font-weight: 600; text-align: center; }
.goal { font-size: 15px; color: var(--muted); }

/* tasks */
.task { position: relative; display: flex; gap: 14px; align-items: flex-start; border-radius: 14px; padding: 14px; cursor: pointer; box-shadow: none; }
.task input { position: absolute; opacity: 0; pointer-events: none; }
.task .box { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--brand); flex: none; display: grid; place-items: center; transition: background .15s; background: var(--card); }
.task .box svg { width: 16px; height: 16px; opacity: 0; color: #fff; }
.task.done .box { background: var(--green); border-color: var(--green); }
.task.done .box svg { opacity: 1; }
.task.done .t { color: var(--muted); text-decoration: line-through; }
.task:has(input:focus-visible) { outline: 3px solid var(--brand); }
.task .t { flex: 1; min-width: 0; padding-top: 2px; }

/* flashcards */
.fc { min-height: 240px; border-radius: 24px; background: var(--brand); color: #fff; display: grid; place-items: center; padding: 28px; text-align: center; cursor: pointer; border: 0; width: 100%; box-shadow: 0 6px 20px rgba(21, 128, 61, .25); }
.fc.back { background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
.fc .ft { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; direction: ltr; }
.fc .fb { font-size: 1.1rem; max-width: 40ch; }
.fc .hint { font-size: 13px; opacity: .75; margin-top: 10px; }

/* quiz */
.qcard { display: grid; gap: 14px; }
.qtext { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; }
.opt { border: 1.5px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 16px; text-align: start; font-weight: 500; width: 100%; display: flex; gap: 12px; align-items: center; color: var(--ink); box-shadow: var(--shadow); }
.opt .l { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; flex: none; color: var(--brand-strong); }
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt.correct { border-color: var(--green); background: var(--green-soft); }
.opt.correct .l { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.wrong .l { background: var(--red); color: #fff; }
.opt:disabled { cursor: default; }
.feedback { border-radius: 14px; padding: 12px 14px; font-weight: 600; }
.feedback.good { background: var(--green-soft); color: var(--green); }
.feedback.bad { background: var(--red-soft); color: var(--red); }
.feedback p { color: var(--ink); font-weight: 400; margin-top: 4px; font-size: 15px; }
.exam { border: 2px dashed var(--brand); background: var(--card); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }

/* calculators */
.calc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ctile { border-radius: var(--r); padding: 16px; text-align: start; display: grid; gap: 4px; min-width: 0; color: var(--ink); }
.ctile b { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.ctile span { font-size: 13px; color: var(--muted); }
.feature { border: 0; background: var(--brand); color: #fff; border-radius: 24px; padding: 20px; text-align: start; display: flex; align-items: center; gap: 16px; width: 100%; box-shadow: 0 6px 20px rgba(21, 128, 61, .25); }
.feature b { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; display: block; }
.feature svg { width: 40px; height: 40px; flex: none; }
.res { border-radius: 22px; padding: 18px; display: grid; gap: 10px; border-inline-start: 6px solid var(--line); }
.res.good { border-inline-start-color: var(--green); }
.res.mid { border-inline-start-color: #E0A325; }
.res.bad { border-inline-start-color: var(--red); }
.res .lbl { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; color: var(--muted); }
.res .big { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.2rem, 9vw, 2.9rem); line-height: 1.05; direction: ltr; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.res.good .big { color: var(--green); }
.res.mid .big { color: var(--yellow); }
.res.bad .big { color: var(--red); }
.rows { display: grid; gap: 0; background: var(--soft); border-radius: 14px; padding: 4px 14px; }
.rows div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.rows div:last-child { border-bottom: 0; }
.rows .v { font-family: var(--font-display); font-weight: 600; direction: ltr; font-variant-numeric: tabular-nums; white-space: nowrap; }
.help { background: var(--brand-soft); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; font-size: 15px; }
.help .formula { background: var(--card); }
.stick { position: sticky; top: calc(58px + env(safe-area-inset-top, 0px)); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 999px; padding: 8px 8px 8px 16px; border-inline-start: 6px solid var(--line); }
.stick.good { border-inline-start-color: var(--green); }
.stick.mid { border-inline-start-color: #E0A325; }
.stick.bad { border-inline-start-color: var(--red); }
.stick b { font-family: var(--font-display); font-size: 1.15rem; direction: ltr; font-variant-numeric: tabular-nums; }
.stick .lab { font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inps { display: grid; gap: 10px; }
.inp { border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; box-shadow: none; }
.inp-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.inp-top label { font-weight: 600; font-size: 15px; min-width: 0; }
.inp-num { display: inline-flex; align-items: center; gap: 4px; background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 12px; direction: ltr; flex: none; min-height: 44px; }
.inp-num input { border: 0; background: transparent; width: 92px; padding: 6px 0; text-align: left; font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--ink); }
.inp-num input:focus { outline: none; }
.inp-num:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.inp-num .unit { font-size: 13px; color: var(--muted); padding-inline: 4px 8px; }
input[type="range"] { width: 100%; accent-color: var(--brand); height: 26px; margin: 0; }
details.adv { border-radius: var(--r); }
details.adv > summary { list-style: none; padding: 14px 16px; font-weight: 600; font-family: var(--font-display); cursor: pointer; display: flex; justify-content: space-between; color: var(--ink); }
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary::after { content: "▾"; color: var(--brand); }
details.adv[open] > summary::after { content: "▴"; }
details.adv > .inps { padding: 0 10px 10px; }
details.adv .inp { background: var(--soft); border-color: transparent; }
.verdict { border-radius: 22px; padding: 20px; display: grid; gap: 14px; border-inline-start: 8px solid var(--line); color: var(--ink); }
.verdict.good { border-inline-start-color: var(--green); }
.verdict.bad { border-inline-start-color: var(--red); }
.verdict .vt { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; line-height: 1; }
.verdict.good .vt { color: var(--green); }
.verdict.bad .vt { color: var(--red); }
.reasons { display: grid; gap: 8px; }
.reasons div { display: flex; gap: 10px; align-items: center; background: var(--soft); border-radius: 12px; padding: 9px 12px; font-weight: 500; flex-wrap: wrap; }
.reasons .mk { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; flex: none; font-size: 13px; color: #fff; }
.reasons .mk.ok { background: var(--green); }
.reasons .mk.no { background: var(--red); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { border-radius: 16px; padding: 14px; min-width: 0; }
.kpi .k { font-size: 13px; color: var(--muted); font-weight: 600; }

/* ===================== MARKET DATA (Census ACS by ZIP, shipped as data/<ST>.json) ===================== */
const MKT = { idx: undefined, states: {} };
const ST_NAMES = { AL: "Alabama", AK: "Alaska", AZ: "Arizona", AR: "Arkansas", CA: "California", CO: "Colorado", CT: "Connecticut", DE: "Delaware", DC: "District of Columbia", FL: "Florida", GA: "Georgia", HI: "Hawaii", ID: "Idaho", IL: "Illinois", IN: "Indiana", IA: "Iowa", KS: "Kansas", KY: "Kentucky", LA: "Louisiana", ME: "Maine", MD: "Maryland", MA: "Massachusetts", MI: "Michigan", MN: "Minnesota", MS: "Mississippi", MO: "Missouri", MT: "Montana", NE: "Nebraska", NV: "Nevada", NH: "New Hampshire", NJ: "New Jersey", NM: "New Mexico", NY: "New York", NC: "North Carolina", ND: "North Dakota", OH: "Ohio", OK: "Oklahoma", OR: "Oregon", PA: "Pennsylvania", RI: "Rhode Island", SC: "South Carolina", SD: "South Dakota", TN: "Tennessee", TX: "Texas", UT: "Utah", VT: "Vermont", VA: "Virginia", WA: "Washington", WV: "West Virginia", WI: "Wisconsin", WY: "Wyoming", PR: "Puerto Rico" };
async function mktIndex() {
  if (MKT.idx !== undefined) return MKT.idx;
  try { const r = await fetch("data/index.json"); if (!r.ok) throw 0; MKT.idx = await r.json(); } catch (e) { MKT.idx = null; }
  return MKT.idx;
}
async function mktState(st) {
  if (!MKT.states[st]) MKT.states[st] = fetch(`data/${st}.json`).then(r => r.ok ? r.json() : null).catch(() => null);
  return MKT.states[st];
}
function decodeZip(zip, row, d, st) {
  const [pop, income, units, vacant, occ, owner, rent, value, built, labor, unemp, pop5, cfips, place] = row;
  const c = d.c[cfips] || [];
  const pct = (a, b) => a != null && b ? a / b * 100 : null;
  return {
    zip, st, place, county: c[0] || "", pop, income, rent, value, built,
    growth: pop != null && pop5 ? (pop / pop5 - 1) * 100 : null,
    vacancy: pct(vacant, units), ownerOcc: pct(owner, occ), unemp: pct(unemp, labor),
    r2p: rent && value ? rent / value * 100 : null,
    incRatio: income && rent ? income / (rent * 12) : null,
    hhi: c[1] ?? null, countyUnemp: c[2] ?? null, year: d.year, src: d.src
  };
}
async function zipData(zip) {
  zip = String(zip || "").trim().slice(0, 5);
  if (!/^\d{5}$/.test(zip)) return null;
  const idx = await mktIndex(); if (!idx) return null;
  const st = idx.zip3[zip.slice(0, 3)]; if (!st) return { miss: true };
  const d = await mktState(st); if (!d || !d.z[zip]) return { miss: true };
  return decodeZip(zip, d.z[zip], d, st);
}
/* free text -> {name, st}: "Akron ohio", "akron, OH", "Maricopa County Arizona", "new york ny" */
const ST_BY_NAME = Object.fromEntries(Object.entries(ST_NAMES).map(([k, v]) => [v.toLowerCase(), k]));
const ST_NAMES_LONGEST = Object.keys(ST_BY_NAME).sort((a, b) => b.length - a.length);
function parseLoc(q) {
  let s = String(q || "").replace(/[.]/g, " ").replace(/\s+/g, " ").trim(), st = null;
  const low = s.toLowerCase();
  for (const n of ST_NAMES_LONGEST) {
    if (low === n) return { name: "", st: ST_BY_NAME[n] };
    if (low.endsWith(" " + n) || low.endsWith("," + n)) { st = ST_BY_NAME[n]; s = s.slice(0, s.length - n.length); break; }
  }
  if (!st) { const m = s.match(/^(.*?)[\s,]+([A-Za-z]{2})$/); if (m && ST_NAMES[m[2].toUpperCase()]) { st = m[2].toUpperCase(); s = m[1]; } }
  s = s.replace(/[\s,]+$/, "").replace(/\s+county$/i, "").trim();
  return { name: s, st };
}
/* city + state in any form -> ZIPs of that place, largest population first; null when no state was given */
async function placeZips(q) {
  const loc = parseLoc(q); if (!loc.st || !loc.name) return null;
  const st = loc.st, d = await mktState(st); if (!d) return [];
  const list = d.p[loc.name.toLowerCase()] || [];
  return list.map(z => decodeZip(z, d.z[z], d, st)).sort((a, b) => (b.pop || 0) - (a.pop || 0));
}
/* auto 1–5 scores for the metrics Census covers; index = MARKET_METRICS row */
const step = (x, cuts, desc = true) => x == null ? null : desc ? (x >= cuts[0] ? 5 : x >= cuts[1] ? 4 : x >= cuts[2] ? 3 : x >= cuts[3] ? 2 : 1) : (x <= cuts[0] ? 5 : x <= cuts[1] ? 4 : x <= cuts[2] ? 3 : x <= cuts[3] ? 2 : 1);
function autoScores(z) {
  return {
    0: step(z.growth, [5, 2, 0, -2]),
    1: step(z.hhi, [0.085, 0.095, 0.105, 0.12], false),
    2: step(z.incRatio, [3.5, 3, 2.5, 2]),
    3: step(z.r2p, [1, 0.8, 0.65, 0.5]),
    4: step(z.ownerOcc, [65, 55, 45, 35]),
    5: step(z.vacancy, [5, 7, 10, 14], false)
  };
}
const fmtP = (v, d = 1) => v == null || !isFinite(v) ? "—" : v.toFixed(d) + "%";
const fmtD = v => v == null || !isFinite(v) ? "—" : "$" + Math.round(v).toLocaleString("en-US");
function metricValue(r, z) {
  switch (r) {
    case 0: return `צמיחה ב-5 שנים: ${fmtP(z.growth)} · אוכלוסייה ${z.pop ? z.pop.toLocaleString("en-US") : "—"}`;
    case 1: return `מדד ריכוזיות ענפים במחוז: ${z.hhi ?? "—"} (נמוך = מגוון) · אבטלה ${fmtP(z.unemp)}`;
    case 2: return `הכנסה חציונית ${fmtD(z.income)} = פי ${z.incRatio ? z.incRatio.toFixed(1) : "—"} מהשכירות השנתית`;
    case 3: return `שכירות חציונית ${fmtD(z.rent)} ÷ שווי חציוני ${fmtD(z.value)} = ${fmtP(z.r2p, 2)}`;
    case 4: return `בעלי בתים: ${fmtP(z.ownerOcc)}`;
    case 5: return `דירות ריקות: ${fmtP(z.vacancy)}`;
    default: return "";
  }
}

    <a href="https://duckduckgo.com/?q=${encodeURIComponent("\\" + where + " " + q + " official site")}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit;display:flex;gap:14px;align-items:center;flex:1;min-width:0"><span class="body"><b class="en" style="text-align:start">${esc(n)}</b><span class="tiny muted">${esc(d)}</span></span><span class="pill dark">פתח אתר ↗</span></a>
    <a class="tiny" href="https://duckduckgo.com/?q=${encodeURIComponent(where + " " + q)}" target="_blank" rel="noopener noreferrer" style="color:var(--muted);flex-basis:100%">לא הגעת לאתר הנכון? כל התוצאות</a></div>`).join("");
}
async function runCountyFinder() {
  const q = $("#cfIn").value.trim(), out = $("#cfOut");
  if (!q) return;
  let where = "", label = "";
  if (/^\d{5}$/.test(q)) {
    const z = await zipData(q);
    if (z && !z.miss) { const c = z.county.replace(/ County$/i, ""); where = `${c} County ${ST_NAMES[z.st] || z.st}`; label = `${c} County, ${ST_NAMES[z.st] || z.st}`; }
    else { where = `${q} county`; label = `המחוז של מיקוד ${q}`; }
  } else {
    const loc = parseLoc(q), nm = loc.name || q;
    where = loc.st ? `${nm} County ${ST_NAMES[loc.st]}` : `${nm} County`;
    label = loc.st ? `${nm} County, ${ST_NAMES[loc.st]}` : `${nm} County`;
  }
  out.innerHTML = `<p class="small"><b>${esc(label)}</b> — שמות המשרדים משתנים בין מדינות (Auditor / Assessor / Appraiser). הכפתור פותח את האתר הרשמי ישירות. אם הגעת לאתר לא נכון, לחץ ״כל התוצאות״.</p>${/^\d{5}$/.test(q) || parseLoc(q).st ? "" : `<p class="tiny muted">טיפ: הוסף מדינה לתוצאה מדויקת יותר, למשל Summit Ohio.</p>`}<div class="list">${countyLinks(where)}</div>`;
}

const I = (k, label, def, min, max, step, unit = "$") => ({ k, label, def, min, max, step, unit });
const lv = (x, g, m) => !isFinite(x) ? null : x >= g ? "good" : x >= m ? "mid" : "bad";
const lvLow = (x, g, m) => !isFinite(x) ? null : x <= g ? "good" : x <= m ? "mid" : "bad";
function balanceAfter(loan, ratePct, years, months) {
  const r = ratePct / 1200, P = pmt(loan, ratePct, years);
  return r ? loan * Math.pow(1 + r, months) - P * (Math.pow(1 + r, months) - 1) / r : loan - P * months;
}
function interestFirstYear(loan, ratePct, years) {
  const r = ratePct / 1200, P = pmt(loan, ratePct, years); let b = loan, s = 0;
  for (let i = 0; i < 12; i++) { const it = b * r; s += it; b -= P - it; }
  return s;
}
function irr(flows) {
  const npv = x => flows.reduce((a, f, t) => a + f / Math.pow(1 + x, t), 0);
  let lo = -0.95, hi = 2;
  if (npv(lo) * npv(hi) > 0) return NaN;
  for (let i = 0; i < 100; i++) { const mid = (lo + hi) / 2; if (npv(lo) * npv(mid) <= 0) hi = mid; else lo = mid; }
  return (lo + hi) / 2;
}

function calcDeal(v) {

    const gross = v.units * v.rent, vacancy = gross * vac / 100, egi = gross - vacancy;

    return { gross, vacancy, egi, tax, ins, mgmt, maint, capex, util, leasing, hoa, opex, noi, loan, debt, cf };
  };

}

function currentWeek() { const w = Math.floor((new Date() - new Date(S.start + "T00:00:00")) / (7 * 864e5)) + 1; return Math.max(1, Math.min(24, w)); }

    ok(door >= v.target, `תזרים לדירה (יעד ${fmtD(v.target)})`, fmtD(door));
    pass = r1 >= 1 && door >= v.target;
    const need = (v.target * u + mort) / 0.5;
    steps.push({ s: "i", t: "שכירות שצריך כדי לעבור", val: `${fmtD(need)} (${pct(need / base * 100, 2)})` });
    cta = ["חיתום מלא בבדיקת עסקה", "deal"];
  } else if (v.mode === "multi") {
    const noi = v.mrent * 12 * (1 - v.mexp / 100), cap = noi / v.mprice * 100, loan = v.mprice * (1 - v.down / 100), debt = pmt(loan, v.rate, 30) * 12, lc = napOfLoan(v) * 12, dscr = noi / debt, ppu = v.mprice / v.munits;
    ok(null, "NOI שנתי (חישוב שלך, לא של הברוקר)", fmtD(noi));
    ok(cap > lc, `Cap Rate מול קבוע הלוואה ${pct(lc)}`, pct(cap));
    ok(dscr >= 1.25, "DSCR (יעד 1.25)", dscr.toFixed(2));
    if (v.mppu > 0) ok(ppu <= v.mppu * 1.1, `מחיר ליחידה מול עסקאות דומות ${fmtD(v.mppu)}`, fmtD(ppu));
    else ok(null, "מחיר ליחידה (השווה לעסקאות דומות)", fmtD(ppu));
    pass = cap > lc && dscr >= 1.25 && (!(v.mppu > 0) || ppu <= v.mppu * 1.1);

    ok(null, `MAO = ARV × ${v.fpct}% − שיפוץ`, fmtD(mao));
    ok(v.ask <= mao, "מחיר מבוקש ≤ MAO", fmtD(v.ask));
    if (v.arv <= 150000 && v.fpct > 65) steps.push({ s: "i", t: "ARV של 150 אלף ומטה: בשוק זול עובדים עם 65%", val: fmtD(v.arv * 0.65 - reh) });
    pass = v.ask <= mao;
    if (!pass && mao > 0) steps.push({ s: "i", t: "אפשר להציע את ה-MAO", val: fmtD(mao) });
  } else if (v.mode === "brrrr") {
    const u = Math.max(1, v.bunits), all = v.bprice + v.brehab + v.bclose, cap75 = v.barv * 0.75, loan = v.barv * v.bltv / 100, mort = loan * napOfLoan(v) / 100, door = (v.brent * 0.5 - mort) / u;
    ok(all <= cap75, "הכל נכנס? מחיר + שיפוץ + סגירה ≤ 75% מה-ARV", `${fmtD(all)} / ${fmtD(cap75)}`);
    ok(null, `הלוואה חדשה (${v.bltv}% מה-ARV)`, fmtD(loan));
    ok(null, `משכנתא ≈ ${napOfLoan(v).toFixed(2)}% מההלוואה החדשה`, fmtD(mort));
    ok(door >= v.target, `תזרים אחרי מימון מחדש, לדירה (יעד ${fmtD(v.target)})`, fmtD(door));
    pass = all <= cap75 && door >= v.target;
  } else {
    const reh = v.wrehab * (1 + v.wcont / 100), mao = v.yarv * v.wpct / 100 - reh;
    if (v.warv > 0) { const gap = (v.warv / v.yarv - 1) * 100; ok(gap <= 5, "ה-ARV שלו מול ה-Comps שלך", gap > 0 ? `גבוה ב-${Math.round(gap)}%` : "תואם"); }
    ok(null, `MAO לפי המספרים שלך (שיפוץ + ${v.wcont}% בלת״ם)`, fmtD(mao));
    ok(v.wask <= mao, "המחיר שלו (העמלה כבר בפנים) ≤ MAO", fmtD(v.wask));
    pass = v.wask <= mao;
    if (!pass && mao > 0) steps.push({ s: "i", t: "אפשר להציע לו", val: fmtD(mao) });
  }
  if (v.noMgmt) { pass = false; steps.unshift({ s: "n", t: "חברת ניהול מקומית מסרבת לנהל באזור", val: "פסילה מיידית" }); }

}
function napkinResult(v) {

  const { e, missing } = napValues(v);
  if (missing.length) return `<div class="warnline">חסר כדי לבדוק: ${missing.map(esc).join(", ")}</div>`;
  const r = napkin(e);
  return `<div class="verdict ${r.pass ? "good" : "bad"}"><span class="small muted">מבחן המפית · ${esc(NAP_MODES.find(m => m[0] === v.mode)[1])}</span>

    <div class="reasons">${r.steps.map(s => `<div><span class="mk ${s.s === "y" ? "ok" : s.s === "n" ? "no" : ""}" style="${s.s === "i" ? "background:var(--soft-2);color:var(--ink)" : ""}">${s.s === "y" ? "✓" : s.s === "n" ? "✕" : "="}</span><span style="flex:1">${esc(s.t)}</span><b class="num" style="white-space:nowrap">${esc(s.val)}</b></div>`).join("")}</div>
    ${!v.taxOk ? `<div class="warnline">לא בדקת את המס האמיתי ב-Auditor. מס רכוש באוהיו יכול להיות גבוה מההערכה.</div>` : ""}
    ${r.pass && r.cta ? `<button class="btn primary" id="napToDeal" style="justify-self:start">${r.cta[0]} ←</button>` : ""}
    ${S.ui.napFor ? `<button class="btn" id="saveNap" style="justify-self:start">שמור תוצאה לנכס</button>` : ""}
  </div>`;
}
function napStick(v) {
  if (!v.checked[v.mode]) return { cls: "", lab: "מבחן המפית", val: "—", pill: "" };
  const { e, missing } = napValues(v); if (missing.length) return { cls: "mid", lab: "חסרים נתונים", val: "—", pill: "" };
  const r = napkin(e); return { cls: r.pass ? "good" : "bad", lab: "מבחן המפית", val: r.pass ? "עובר ✓" : "נכשל ✕", pill: "" };
}
function napField([k, label, ex, def, unit], v) {
  const val = v.vals[k] ?? "";
  return `<label${k === "mppu" || k === "warv" ? ' class="full"' : ""}>${label}${def === null ? ' <span style="color:var(--red)">*</span>' : ""}
    <span class="inp-num" style="width:100%;justify-content:space-between"><input type="number" step="any" inputmode="decimal" data-nk="${k}" value="${esc(val)}" placeholder="${esc(ex)}" style="width:100%"><span class="unit">${unit}</span></span></label>`;
}
function viewNapkin() {
  const v = napState(), ap = S.ui.napFor ? getProp(S.ui.napFor) : null, { e } = napValues(v);
  return `${ap ? `<section class="card stack" style="gap:6px;outline:2px solid var(--brand)"><span class="tiny muted">מבחן מפית לנכס מהטבלה</span><b style="font-family:var(--font-display)" dir="auto">${esc(ap.addr)}</b><button class="btn sm soft" id="stopNap" style="justify-self:start">ביטול</button></section>` : ""}
  <section class="stack" style="gap:6px"><h1>מבחן המפית</h1><p class="muted">סינון של 2 דקות במספרים מעוגלים. נועד לפסול עסקאות, לא לאשר אותן.</p></section>
  <div class="chips" role="group" aria-label="אסטרטגיה">${NAP_MODES.map(([k, l]) => `<button data-nmode="${k}" aria-pressed="${v.mode === k}">${l}</button>`).join("")}</div>
  <section class="card stack" style="gap:8px"><b style="font-family:var(--font-display)">פסילה מיידית, לפני כל מספר</b>
    <label class="task ${v.noMgmt ? "done" : ""}" style="box-shadow:none"><input type="checkbox" id="napMgmt" ${v.noMgmt ? "checked" : ""}><span class="box" style="${v.noMgmt ? "background:var(--red);border-color:var(--red)" : ""}">${IC.check}</span><span class="t" style="text-decoration:none">חברת ניהול מקומית מסרבת לנהל באזור</span></label>
    <label class="task ${v.taxOk ? "done" : ""}" style="box-shadow:none"><input type="checkbox" id="napTax" ${v.taxOk ? "checked" : ""}><span class="box">${IC.check}</span><span class="t" style="text-decoration:none">בדקתי את המס האמיתי של הנכס ב-Auditor</span></label>
  </section>

  <details class="adv"><summary>הנחות: ריבית ${e.rate}% · משכנתא ≈ ${napOfPrice(e).toFixed(2)}% מהמחיר</summary><div class="form" style="padding:0 14px 14px">${NAP_COMMON.map(f => napField(f, v)).join("")}<p class="tiny muted full">לא בטוח: המכפיל מבוסס על ריבית DSCR של 6.5%–7.5%. כשתקבל ריבית מהברוקר, עדכן אותה כאן והמכפיל יתעדכן לבד (6.5% ≈ 0.47%).</p></div></details>

}
function napFromProp(id) {
  const p = getProp(id); if (!p) return;

    v.mode = p.source === "Wholesaler" ? "whole" : "flip";
    Object.assign(v.vals, v.mode === "whole" ? { warv: +p.arv, wask: price } : { arv: +p.arv, ask: price });
  } else if (units >= 5) { v.mode = "multi"; Object.assign(v.vals, { mprice: price, munits: units, mrent: rent }); }
  else { v.mode = "rental"; Object.assign(v.vals, { price, rent, units, rehab: "" }); }

}
function napRefresh() {
  const v = napState(), open = $("#res details")?.open;
  $("#res").innerHTML = napkinResult(v); renderStick(napStick(v)); wireNapResult();
  const s = $(".adv > summary"); if (s) { const { e } = napValues(v); s.textContent = `הנחות: ריבית ${e.rate}% · משכנתא ≈ ${napOfPrice(e).toFixed(2)}% מהמחיר`; }
}
function wireNapkin() {
  const v = napState();
  watchStick(() => napStick(v)); wireNapResult();
  $("#app").oninput = e => { const k = e.target.dataset.nk; if (!k) return; v.vals[k] = e.target.value; save(); if (v.checked[v.mode]) napRefresh(); };
  $$("[data-nmode]").forEach(b => b.onclick = () => { v.mode = b.dataset.nmode; save(); go("napkin", { keepScroll: true }); });
  $("#napMgmt").onchange = e => { v.noMgmt = e.target.checked; save(); go("napkin", { keepScroll: true }); };
  $("#napTax").onchange = e => { v.taxOk = e.target.checked; save(); go("napkin", { keepScroll: true }); };
  $("#napCheck").onclick = () => { v.checked[v.mode] = true; save(); napRefresh(); $("#napCheck").textContent = "בדוק שוב"; $("#res").scrollIntoView({ behavior: calm() ? "auto" : "smooth", block: "start" }); };
  $("#napClear").onclick = () => { NAP_F[v.mode].forEach(([k]) => delete v.vals[k]); v.checked[v.mode] = false; save(); go("napkin", { keepScroll: true }); };

}
function wireNapResult() {
  const v = napState();
  const toDeal = $("#napToDeal");
  if (toDeal) toDeal.onclick = () => { const { e } = napValues(v), d = Object.assign(dealDefaults(), S.calc.deal || {}); d.price = e.price; d.units = e.units; d.rent = Math.round(e.rent / Math.max(1, e.units)); d.rate = e.rate; d.down = e.down; d.repairs = e.rehab; S.calc.deal = d; S.ui.analyzing = S.ui.napFor || null; save(); go("c-deal"); };

/* ===================== BOOT ===================== */

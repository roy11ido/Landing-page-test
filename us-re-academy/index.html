<title>מסלול נדל״ן ארה״ב</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell, one 720px column, fixed bottom nav (4 tabs). Black / white / red, green only for "passes". */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --soft: #F4F4F5;
  --soft-2: #E7E7EA;
  --ink: #0A0A0B;
  --muted: #6B6B73;
  --line: #E4E4E7;
  --red: #E10600;
  --red-ink: #FFFFFF;
  --red-soft: #FDECEB;
  --green: #0E9348;
  --green-soft: #E3F5EA;
  --yellow: #B97C00;
  --yellow-soft: #FFF3D1;
  --inv: #0A0A0B;
  --inv-ink: #FFFFFF;
  --font-display: "Rubik", "Arial Hebrew", Arial, sans-serif;
  --font-body: "Assistant", "Rubik", "Segoe UI", Arial, sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0B; --surface: #141416; --soft: #1B1B1E; --soft-2: #2A2A2F; --ink: #F7F7F8; --muted: #9C9CA5; --line: #2A2A2E;
    --red: #FF3B30; --red-ink: #FFFFFF; --red-soft: #3A1412; --green: #38C871; --green-soft: #10291B; --yellow: #F2B33D; --yellow-soft: #33280F;
    --inv: #F7F7F8; --inv-ink: #0A0A0B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0B; --surface: #141416; --soft: #1B1B1E; --soft-2: #2A2A2F; --ink: #F7F7F8; --muted: #9C9CA5; --line: #2A2A2E;
  --red: #FF3B30; --red-ink: #FFFFFF; --red-soft: #3A1412; --green: #38C871; --green-soft: #10291B; --yellow: #F2B33D; --yellow-soft: #33280F;
  --inv: #F7F7F8; --inv-ink: #0A0A0B; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { direction: rtl; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 1.75rem; font-weight: 800; }
h2 { font-size: 1.25rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.num { font-family: var(--font-display); direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.en { direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }

/* shell */
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 12px; min-height: 60px; }
.topbar .ttl { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--soft); display: grid; place-items: center; flex: none; }
.back svg { width: 20px; height: 20px; }
.chip-pct { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; background: var(--soft); border-radius: 999px; padding: 4px 12px 4px 6px; }
.chip-pct .dot-ring { width: 22px; height: 22px; }
main { padding-block: 4px calc(110px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
.nav { position: fixed; inset: auto 0 0 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding-block: 6px; }
.nav button { border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 12.5px; font-weight: 600; color: var(--muted); border-radius: 14px; }
.nav button svg { width: 24px; height: 24px; }
.nav button .ic { width: 56px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"] .ic { background: var(--red); color: var(--red-ink); }

/* atoms */
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1.5px solid var(--ink); background: transparent; border-radius: 999px; padding: 11px 20px; font-weight: 700; font-family: var(--font-display); font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn.primary { background: var(--red); border-color: var(--red); color: var(--red-ink); }
.btn.dark { background: var(--inv); border-color: var(--inv); color: var(--inv-ink); }
.btn.soft { background: var(--soft); border-color: var(--soft); }
.btn.sm { padding: 6px 14px; min-height: 36px; font-size: 14px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn:active { transform: scale(.98); }
a.btn { text-decoration: none; color: inherit; }
a.btn.dark { color: var(--inv-ink); }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--soft); display: grid; place-items: center; font-weight: 700; flex: none; }
.card { background: var(--soft); border-radius: var(--r); padding: 18px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 11px; font-size: 13px; font-weight: 700; background: var(--soft); white-space: nowrap; }
.pill.good { background: var(--green-soft); color: var(--green); }
.pill.mid { background: var(--yellow-soft); color: var(--yellow); }
.pill.bad { background: var(--red-soft); color: var(--red); }
.pill.dark { background: var(--inv); color: var(--inv-ink); }
.bar { height: 8px; border-radius: 99px; background: var(--soft-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--red); transition: width .3s; }
.bar.good i { background: var(--green); }
.seg { display: flex; background: var(--soft); border-radius: 999px; padding: 4px; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; border: 0; background: none; border-radius: 999px; padding: 9px 14px; font-weight: 700; font-family: var(--font-display); font-size: 14px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--inv); color: var(--inv-ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; font-family: var(--font-display); }
.chips button[aria-pressed="true"] { background: var(--inv); color: var(--inv-ink); border-color: var(--inv); }
.ringbox { position: relative; display: inline-grid; place-items: center; flex: none; }
.ringbox .in { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-display); }
.ring circle { transition: stroke-dashoffset .5s; }
.sec-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

/* home */
.hero { background: var(--inv); color: var(--inv-ink); border-radius: 24px; padding: 22px; display: grid; gap: 16px; }
.hero .top { display: flex; gap: 18px; align-items: center; }
.hero .wk { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; }
.hero .wk small { font-size: 1rem; font-weight: 500; opacity: .7; }
.weeks { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
.weeks span { height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--inv-ink) 22%, transparent); }
.weeks span.done { background: var(--inv-ink); }
.weeks span.now { background: var(--red); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { border: 0; background: var(--soft); border-radius: var(--r); padding: 16px 12px; display: grid; gap: 8px; justify-items: start; text-align: start; min-width: 0; }
.tile svg { width: 26px; height: 26px; }
.tile b { font-family: var(--font-display); font-size: 15px; }
.tile span { font-size: 13px; color: var(--muted); }
.tile.red { background: var(--red); color: var(--red-ink); }
.tile.red span { color: var(--red-ink); opacity: .85; }

/* lists */
.list { display: grid; gap: 8px; }
.li { border: 0; background: var(--soft); border-radius: var(--r); padding: 14px 16px; display: flex; align-items: center; gap: 14px; text-align: start; width: 100%; min-width: 0; }
.li .nbadge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; background: var(--surface); border: 2px solid var(--line); flex: none; }
.li .nbadge.done { background: var(--green); border-color: var(--green); color: #fff; }
.li .nbadge.now { background: var(--red); border-color: var(--red); color: var(--red-ink); }
.li .body { flex: 1; min-width: 0; display: grid; gap: 3px; }
.li .body b { font-family: var(--font-display); font-weight: 600; }
.li .chev { color: var(--muted); flex: none; }

/* module: terms accordion */
details.term { background: var(--soft); border-radius: 14px; }
details.term summary { list-style: none; padding: 13px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; font-family: var(--font-display); }
details.term summary::-webkit-details-marker { display: none; }
details.term summary::after { content: "+"; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 700; flex: none; }
details.term[open] summary::after { content: "−"; background: var(--red); color: var(--red-ink); }
details.term .ans { padding: 0 16px 14px; display: grid; gap: 6px; }
details.term .ex { font-size: 14px; background: var(--surface); border-radius: 10px; padding: 6px 10px; }
.terms { display: grid; gap: 6px; }
.steps { display: grid; gap: 8px; counter-reset: s; }
.steps div { display: flex; gap: 12px; align-items: flex-start; background: var(--soft); border-radius: 14px; padding: 12px 14px; }
.steps div::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--inv); color: var(--inv-ink); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; flex: none; font-size: 14px; }
.bul { display: grid; gap: 6px; }
.bul div { display: flex; gap: 10px; align-items: flex-start; }
.bul div::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); margin-top: 9px; flex: none; }
.bul.warn div::before { background: var(--red); }
.formula { font-family: var(--font-display); direction: ltr; background: var(--inv); color: var(--inv-ink); border-radius: 12px; padding: 10px 14px; font-weight: 600; text-align: center; }
.goal { font-size: 15px; color: var(--muted); }

/* tasks */
.task { position: relative; display: flex; gap: 14px; align-items: flex-start; background: var(--soft); border-radius: 14px; padding: 14px; cursor: pointer; }
.task input { position: absolute; opacity: 0; pointer-events: none; }
.task .box { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); flex: none; display: grid; place-items: center; transition: background .15s; }
.task .box svg { width: 16px; height: 16px; opacity: 0; color: #fff; }
.task.done .box { background: var(--green); border-color: var(--green); }
.task.done .box svg { opacity: 1; }
.task.done .t { color: var(--muted); text-decoration: line-through; }
.task:has(input:focus-visible) { outline: 3px solid var(--red); }
.task .t { flex: 1; min-width: 0; padding-top: 2px; }

/* flashcards */
.fc { min-height: 240px; border-radius: 24px; background: var(--inv); color: var(--inv-ink); display: grid; place-items: center; padding: 28px; text-align: center; cursor: pointer; border: 0; width: 100%; }
.fc.back { background: var(--soft); color: var(--ink); }
.fc .ft { font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; direction: ltr; }
.fc .fb { font-size: 1.1rem; max-width: 40ch; }
.fc .hint { font-size: 13px; opacity: .6; margin-top: 10px; }

/* quiz */
.qcard { display: grid; gap: 14px; }
.qtext { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; text-align: start; font-weight: 600; width: 100%; display: flex; gap: 12px; align-items: center; }
.opt .l { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-family: var(--font-display); font-size: 14px; flex: none; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt.correct { border-color: var(--green); background: var(--green-soft); }
.opt.correct .l { background: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt.wrong .l { background: var(--red); color: #fff; }
.opt:disabled { cursor: default; }
.feedback { border-radius: 14px; padding: 12px 14px; font-weight: 600; }
.feedback.good { background: var(--green-soft); color: var(--green); }
.feedback.bad { background: var(--red-soft); color: var(--red); }
.feedback p { color: var(--ink); font-weight: 400; margin-top: 4px; font-size: 15px; }
.exam { border: 2px dashed var(--ink); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }

/* calculators */
.calc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ctile { border: 0; background: var(--soft); border-radius: var(--r); padding: 16px; text-align: start; display: grid; gap: 4px; min-width: 0; }
.ctile b { font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.ctile span { font-size: 13px; color: var(--muted); }
.feature { border: 0; background: var(--red); color: var(--red-ink); border-radius: 24px; padding: 20px; text-align: start; display: flex; align-items: center; gap: 16px; width: 100%; }
.feature b { font-family: var(--font-display); font-size: 1.25rem; display: block; }
.feature svg { width: 40px; height: 40px; flex: none; }
.res { border-radius: 24px; padding: 20px; display: grid; gap: 10px; background: var(--soft); }
.res.good { background: var(--green-soft); }
.res.mid { background: var(--yellow-soft); }
.res.bad { background: var(--red-soft); }
.res .lbl { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.res .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1.05; direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
.res.good .big { color: var(--green); }
.res.mid .big { color: var(--yellow); }
.res.bad .big { color: var(--red); }
.rows { display: grid; gap: 0; background: var(--surface); border-radius: 14px; padding: 4px 14px; }
.rows div { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.rows div:last-child { border-bottom: 0; }
.rows .v { font-family: var(--font-display); font-weight: 600; direction: ltr; font-variant-numeric: tabular-nums; white-space: nowrap; }
.help { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; font-size: 15px; }
.inps { display: grid; gap: 10px; }
.inp { background: var(--soft); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
.inp-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.inp-top label { font-weight: 600; font-size: 15px; min-width: 0; }
.inp-num { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 999px; padding: 2px 4px 2px 12px; direction: ltr; flex: none; }
.inp-num input { border: 0; background: transparent; width: 92px; padding: 6px 0; text-align: left; font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.inp-num input:focus { outline: none; }
.inp-num:focus-within { outline: 3px solid var(--red); }
.inp-num .unit { font-size: 13px; color: var(--muted); padding-inline: 4px 8px; }
input[type="range"] { width: 100%; accent-color: var(--red); height: 24px; margin: 0; }
details.adv { background: var(--soft); border-radius: var(--r); }
details.adv > summary { list-style: none; padding: 14px 16px; font-weight: 700; font-family: var(--font-display); cursor: pointer; display: flex; justify-content: space-between; }
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary::after { content: "▾"; }
details.adv[open] > summary::after { content: "▴"; }
details.adv > .inps { padding: 0 10px 10px; }
details.adv .inp { background: var(--surface); }
.verdict { border-radius: 24px; padding: 22px; display: grid; gap: 14px; }
.verdict.good { background: var(--green); color: #fff; }
.verdict.bad { background: var(--red); color: #fff; }
.verdict .vt { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; }
.reasons { display: grid; gap: 8px; }
.reasons div { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.16); border-radius: 12px; padding: 9px 12px; font-weight: 600; }
.reasons .mk { width: 24px; height: 24px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 800; flex: none; font-size: 14px; }
.reasons .mk.ok { color: #0E9348; }
.reasons .mk.no { color: #E10600; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--soft); border-radius: 16px; padding: 14px; min-width: 0; }
.kpi .k { font-size: 13px; color: var(--muted); font-weight: 600; }
.kpi .v { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
.kpi.good .v { color: var(--green); }
.kpi.bad .v { color: var(--red); }
.tbl { overflow-x: auto; background: var(--soft); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: start; border-bottom: 1px solid var(--line); }
th { font-weight: 700; color: var(--muted); font-size: 13px; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: left; direction: ltr; font-family: var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item-row { display: grid; grid-template-columns: minmax(0, 1fr) 72px 92px 36px; gap: 6px; align-items: center; }
.field-in { border: 0; background: var(--surface); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
.field-in[type="number"] { direction: ltr; text-align: left; font-family: var(--font-display); }
.warnline { background: var(--yellow-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; }

/* deals */
.funnel { display: grid; gap: 8px; }
.fstep { display: grid; grid-template-columns: 110px 1fr 54px; gap: 10px; align-items: center; font-size: 14px; font-weight: 600; }
.fstep .bar { height: 14px; }
.dcard { background: var(--soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 8px; }
.dcard .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.dcard .addr { font-family: var(--font-display); font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.sel { border: 0; background: var(--inv); color: var(--inv-ink); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.form .full { grid-column: 1 / -1; }
.form label { font-size: 13px; font-weight: 600; color: var(--muted); display: grid; gap: 3px; }
.dots5 { display: flex; gap: 6px; }
.dots5 button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-family: var(--font-display); font-size: 14px; }
.dots5 button.on { background: var(--inv); color: var(--inv-ink); border-color: var(--inv); }
.metric { background: var(--soft); border-radius: 16px; padding: 12px 14px; display: grid; gap: 8px; }
.metric .mt { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.wsel { border: 0; background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
.toast { position: fixed; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--inv); color: var(--inv-ink); padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 20; }
.example-tag { font-size: 12px; font-weight: 700; color: var(--yellow); }
textarea.field-in { resize: vertical; }

.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tri div { border-radius: 16px; padding: 12px 10px; display: grid; gap: 4px; min-width: 0; }

const I = (k, label, def, min, max, step, unit = "$") => ({ k, label, def, min, max, step, unit });
const lv = (x, g, m) => !isFinite(x) ? null : x >= g ? "good" : x >= m ? "mid" : "bad";
const lvLow = (x, g, m) => !isFinite(x) ? null : x <= g ? "good" : x <= m ? "mid" : "bad";
function balanceAfter(loan, ratePct, years, months) {
  const r = ratePct / 1200, P = pmt(loan, ratePct, years);
  return r ? loan * Math.pow(1 + r, months) - P * (Math.pow(1 + r, months) - 1) / r : loan - P * months;
}
function interestFirstYear(loan, ratePct, years) {
  const r = ratePct / 1200, P = pmt(loan, ratePct, years); let b = loan, s = 0;
  for (let i = 0; i < 12; i++) { const it = b * r; s += it; b -= P - it; }
  return s;
}
function irr(flows) {
  const npv = x => flows.reduce((a, f, t) => a + f / Math.pow(1 + x, t), 0);
  let lo = -0.95, hi = 2;
  if (npv(lo) * npv(hi) > 0) return NaN;
  for (let i = 0; i < 100; i++) { const mid = (lo + hi) / 2; if (npv(lo) * npv(mid) <= 0) hi = mid; else lo = mid; }
  return (lo + hi) / 2;
}

function calcDeal(v) {
  const one = (vac, rate) => {
    const gross = v.units * v.rent, vacancy = gross * vac / 100, egi = gross - vacancy;
    const tax = v.price * v.taxPct / 100 / 12, ins = v.ins, mgmt = egi * v.mgmt / 100, maint = gross * v.maint / 100, capex = gross * v.capex / 100;
    const util = v.util, leasing = v.leasing, hoa = v.hoa || 0, opex = tax + ins + mgmt + maint + capex + util + leasing + hoa, noi = egi - opex;
    const loan = v.price * (1 - v.down / 100), debt = pmt(loan, rate, v.years), cf = noi - debt;
    return { gross, vacancy, egi, tax, ins, mgmt, maint, capex, util, leasing, hoa, opex, noi, loan, debt, cf };
  };
  const b = one(v.vac, v.rate), s = one(v.sVac, v.sRate);
  const cash = v.price * v.down / 100 + v.price * v.closing / 100 + b.loan * v.points / 100 + v.repairs;
  const pitia = b.debt + b.tax + b.ins + b.hoa, lc = pmt(1, v.rate, v.years) * 12 * 100;
  return Object.assign(b, { s, cash, cap: b.noi * 12 / v.price * 100, coc: b.cf * 12 / cash * 100, dscr: b.noi / b.debt, expRatio: b.opex / b.gross * 100, pitia, bankDscr: b.gross / pitia, lc });
}

function currentWeek() { const w = Math.floor((new Date() - new Date(S.start + "T00:00:00")) / (7 * 864e5)) + 1; return Math.max(1, Math.min(24, w)); }
function moduleForWeek(w) { return MODULES.find(m => w >= m.weeks[0] && w <= m.weeks[1]) || MODULES[MODULES.length - 1]; }
function modStats(m) {

const weeksTxt = m => m.weeks[0] === m.weeks[1] ? `שבוע ${m.weeks[0]}` : `שבועות ${m.weeks[0]}–${m.weeks[1]}`;

}

  <button class="btn" id="addCand">+ מועמד ל${r.role}</button>`;
}
const MARKET_SRC = [["Census", "https://data.census.gov"], ["FRED", "https://fred.stlouisfed.org"], ["Census", "https://data.census.gov"], ["Rentometer", "https://www.rentometer.com"], ["Census", "https://data.census.gov"], ["Census", "https://data.census.gov"], ["Redfin", "https://www.redfin.com"], ["Niche", "https://www.niche.com"], ["GreatSchools", "https://www.greatschools.org"], ["City-Data", "https://www.city-data.com"]];
function viewMarket() {
  return `<section class="stack" style="gap:6px"><span class="tiny muted">מודול 3 · כלי 2</span><h1>בחירת שוק ומיקוד</h1><p class="muted">דרג כל מיקום 1–5 לפי נתונים. הציון הגבוה מנצח, ושם מחפשים עסקאות.</p></section><div id="mwrap" class="stack" style="gap:12px"></div>`;
}
function renderMarket() {
  const v = S.t2, c = v.loc;
  const tot = i => { let s = 0, mx = 0; MARKET_METRICS.forEach((_, r) => { s += v.scores[i][r] * v.weights[r]; mx += 5 * v.weights[r]; }); return Math.round(s / mx * 100); };
  const totals = [0, 1, 2].map(tot), best = Math.max(...totals), winners = [0, 1, 2].filter(i => totals[i] === best);
  const allSame = v.scores.every(row => row.every(x => x === 3));
  $("#mwrap").innerHTML = `
  <div class="steps"><div><span>בחר מיקום למטה (לחיצה על הכרטיס)</span></div><div><span>לכל מדד: פתח את המקור, בדוק את הנתון ותן ציון 1–5</span></div><div><span>חזור על זה לשני המיקומים האחרים, והמנצח יופיע כאן</span></div></div>
  ${v.example ? `<div class="warnline row" style="justify-content:space-between"><span>הציונים הם דוגמה, לא נתונים אמיתיים.</span><button class="btn sm soft" id="mClear">התחל מאפס</button></div>` : ""}
  <div class="verdict ${allSame ? "" : winners.length === 1 ? "good" : ""}" style="${allSame || winners.length > 1 ? "background:var(--soft);color:var(--ink)" : ""}">
    <span class="small" style="opacity:.85">${allSame ? "עוד לא דירגת" : winners.length === 1 ? "המנצח — כאן מחפשים עסקאות" : "תיקו"}</span>
    <div class="vt" style="font-size:1.8rem">${allSame ? "דרג לפי נתונים" : winners.length === 1 ? `${esc(v.names[winners[0]])} · ${best}` : winners.map(i => esc(v.names[i])).join(" / ")}</div></div>
  <section class="calc-grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${[0, 1, 2].map(i => `<button class="ctile" data-loc="${i}" aria-pressed="${i === c}" style="justify-items:center;text-align:center;${i === c ? "outline:3px solid var(--red);background:var(--surface)" : ""}">${ring(totals[i], 60, 7, winners.includes(i) && !allSame ? "var(--green)" : "var(--muted)", "var(--soft-2)", `<b class="num">${totals[i]}</b>`)}<b>${esc(v.names[i])}</b>${i === c ? `<span style="color:var(--red);font-weight:700">מדרג עכשיו</span>` : `<span>הקש לדירוג</span>`}</button>`).join("")}</section>
  <label class="small muted">שם המיקום שמדרגים<input class="field-in" id="locName" value="${esc(v.names[c])}" style="background:var(--soft)"></label>
  ${MARKET_METRICS.map((m, r) => `<div class="metric"><div class="mt"><b class="en">${m[0]}</b><a class="pill dark" href="${MARKET_SRC[r][1]}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">${MARKET_SRC[r][0]} ↗</a></div><span class="tiny muted">טוב = ${m[1]}</span><div class="mt"><span class="dots5">${[1, 2, 3, 4, 5].map(x => `<button data-ms="${r}-${x}" class="${v.scores[c][r] === x ? "on" : ""}" aria-label="ציון ${x}">${x}</button>`).join("")}</span><select class="wsel" data-w="${r}" aria-label="חשיבות">${[[1, "חשיבות רגילה"], [2, "חשוב"], [3, "קריטי"]].map(([x, l]) => `<option value="${x}" ${v.weights[r] == x ? "selected" : ""}>${l}</option>`).join("")}</select></div></div>`).join("")}
  <label class="small muted">מקורות ונימוק ל${esc(v.names[c])}<textarea class="field-in" id="locNote" rows="3" style="background:var(--soft)">${esc(v.notes[c])}</textarea></label>`;
}

/* ===================== BACKUP ===================== */
function viewBackup() {
  return `<section class="stack"><h1>גיבוי</h1><p class="muted">ההתקדמות נשמרת רק בדפדפן הזה. העתק את הקוד ושמור אותו אצלך.</p></section>
  <section class="card stack"><textarea id="bkOut" class="field-in" rows="4" readonly style="direction:ltr;font-size:12px">${esc(JSON.stringify(S))}</textarea><button class="btn dark" id="bkCopy">העתק קוד גיבוי</button></section>
  <section class="card stack"><textarea id="bkIn" class="field-in" rows="4" style="direction:ltr;font-size:12px" placeholder="הדבק כאן קוד גיבוי"></textarea><button class="btn" id="bkLoad">שחזר</button><span id="bkMsg" class="small"></span></section>
  <section class="card stack"><b>איפוס מלא</b><span id="bkReset"></span></section>`;
}
function confirmBtn(host, label, fn) {
  const h = $("#" + host); if (!h) return;
  const idle = () => { h.innerHTML = `<button class="btn sm danger">${label}</button>`; h.firstChild.onclick = ask; };
  const ask = () => { h.innerHTML = `<span class="row"><button class="btn sm primary">כן, מחק</button><button class="btn sm soft">ביטול</button></span>`; const b = h.querySelectorAll("button"); b[0].onclick = fn; b[1].onclick = idle; };
  idle();
}

/* ===================== WIRING ===================== */
function wireInputs(store, onChange) {
  $$(".inp").forEach(box => {
    const n = box.querySelector('input[type="number"]'), r = box.querySelector('input[type="range"]'), k = n.dataset.k;
    n.oninput = () => { const x = parseFloat(n.value); if (!isFinite(x)) return; r.value = x; store[k] = x; onChange(); };
    r.oninput = () => { n.value = r.value; store[k] = +r.value; onChange(); };
  });
}
function wire(r) {
  const app = $("#app");
  if (r === "home") $("#startDate").onchange = e => { if (e.target.value) { S.start = e.target.value; save(); go("home"); } };
  if (/^m\d$/.test(r)) {
    const m = MODULES.find(x => x.id === r), re = () => go(m.id, { keepScroll: true });
    $$("[data-sub]").forEach(b => b.onclick = () => { S.ui.sub[m.id] = b.dataset.sub; save(); re(); });
    $$("[data-sub-go]").forEach(b => b.onclick = () => { S.ui.sub[m.id] = b.dataset.subGo; save(); re(); });
    $$("[data-task]").forEach(c => c.onchange = () => { S.tasks[c.dataset.task] = c.checked; save(); re(); });
    $$("[data-exam]").forEach(c => c.onchange = () => { S.exam[c.dataset.exam] = c.checked; save(); re(); if (c.checked) toast(modStats(m).complete ? "המודול הושלם" : "נשאר לעבור את הבוחן"); });
    $$("[data-fc]").forEach(b => b.onclick = () => {
      const st = cardSt[m.id], known = new Set(S.known[m.id] || []), pool = moduleTerms(m).filter(t => !known.has(t.t)), a = b.dataset.fc;
      if (a === "flip") st.flip = !st.flip;
      else if (a === "yes") { known.add(pool[st.i % pool.length].t); S.known[m.id] = [...known]; st.flip = false; save(); }
      else if (a === "no") { st.i++; st.flip = false; }
      else { S.known[m.id] = []; st.i = 0; st.flip = false; save(); }
      re();
    });
    $$("[data-opt]").forEach(b => b.onclick = () => { const st = quizSt[m.id]; st.picked = +b.dataset.opt; st.ans[st.i] = st.picked; re(); });
    $$("[data-quiz]").forEach(b => b.onclick = () => {
      const st = quizSt[m.id];
      if (b.dataset.quiz === "next") {
        st.i++; st.picked = null;
        if (st.i >= m.quiz.length) { st.done = true; const sc = m.quiz.filter((q, i) => st.ans[i] === q.a).length, p = S.quiz[m.id]; if (!p || sc > p.best) S.quiz[m.id] = { best: sc, total: m.quiz.length }; save(); }
      } else quizSt[m.id] = { i: 0, ans: [], picked: null, done: false };
      re();
    });
  }
  if (r === "calc") $$("[data-cat]").forEach(b => b.onclick = () => { S.ui.cat = b.dataset.cat; save(); go("calc", { keepScroll: true }); });
  if (r.startsWith("c-") && r !== "c-deal" && r !== "c-rehab") {
    const c = CALCS.find(x => x.id === r.slice(2)), v = S.calc[c.id];
    wireInputs(v, () => { $("#res").innerHTML = resultHTML(c, v); save(); });
    $("#helpBtn").onclick = e => { const h = $("#help"); h.hidden = !h.hidden; e.currentTarget.setAttribute("aria-expanded", String(!h.hidden)); };
    $("#resetCalc").onclick = () => { delete S.calc[c.id]; save(); go(r); toast("הוחזרו ערכי הדוגמה"); };
  }
  if (r === "c-deal") {
    const v = S.calc.deal;
    wireInputs(v, () => { const open = $("#res details")?.open; $("#res").innerHTML = dealResult(v); if (open) $("#res details").open = true; save(); });
    $("#resetCalc").onclick = () => { delete S.calc.deal; S.ui.analyzing = null; save(); go(r); toast("נטענה דוגמת מודול 4"); };
    if ($("#saveAn")) {
      $("#saveAn").onclick = async () => {
        const p = getProp(S.ui.analyzing); if (!p) { S.ui.analyzing = null; go("deals:pipeline"); return; }
        const d = calcDeal(v), pass = d.coc >= 10 && d.s.cf > 0 && d.dscr >= 1.25;
        const np = { ...p, price: v.price, units: v.units, rent: v.rent * v.units, an: { coc: d.coc, cf: d.cf, cap: d.cap, dscr: d.dscr, bank: d.bankDscr, pass, at: todayISO() } };
        if (np.status < 2 && np.status !== 5) np.status = pass ? 2 : 1;
        S.ui.analyzing = null; await saveProp(np); toast("התוצאה נשמרה לנכס"); go("deals:pipeline");
      };
      $("#stopAn").onclick = () => { S.ui.analyzing = null; save(); go("c-deal"); };
    }
  }
  if (r === "prop") {
    const form = $("#propForm"), ex = S.ui.editId ? getProp(S.ui.editId) : null;
    form.onsubmit = async e => {
      e.preventDefault();
      const g = id => $("#" + id).value.trim(), n = id => { const x = parseFloat(g(id)); return isFinite(x) ? x : null; };
      const p = { ...(ex || { id: newId(), created: Date.now() }), addr: g("f_addr"), link: g("f_link"), source: g("f_source"), zip: g("f_zip"), price: n("f_price"), rent: n("f_rent"), units: n("f_units") || 1, beds: n("f_beds"), sqft: n("f_sqft"), year: n("f_year"), tax: n("f_tax"), hoa: n("f_hoa"), status: +g("f_status"), nextDate: g("f_date"), nextAction: g("f_next"), notes: g("f_notes") };
      if (p.link && !safeUrl(p.link)) { toast("הלינק לא תקין. הדבק כתובת שמתחילה ב-https://"); return; }
      await saveProp(p); toast(ex ? "נשמר" : "הנכס נוסף לטבלה"); go("deals:pipeline");
    };
    if (ex) confirmBtn("delProp", "מחק נכס", async () => { await deleteProp(ex.id); toast("הנכס נמחק"); go("deals:pipeline"); });
  }
  if (r === "c-rehab") {
    const v = S.rehab, upd = () => { $("#res").innerHTML = rehabResult(); save(); };
    wireInputs(v, upd);
    $("#items").oninput = e => { const k = e.target.dataset.it; if (!k) return; const [i, j] = k.split("-").map(Number); v.items[i][j] = j ? +e.target.value : e.target.value; v.example = false; upd(); };
    $("#items").onclick = e => { const d = e.target.closest("[data-del]"); if (d) { v.items.splice(+d.dataset.del, 1); save(); go(r, { keepScroll: true }); } };
    $("#addItem").onclick = () => { v.items.push(["פריט חדש", 1, 0]); save(); go(r, { keepScroll: true }); };
  }
  if (r === "deals") {
    $$("[data-dsub]").forEach(b => b.onclick = () => { S.ui.deals = b.dataset.dsub; save(); go("deals", { keepScroll: true }); });
    const w = $("#dwrap"), sub = S.ui.deals;
    if (sub === "pipeline") {
      renderPipeline();
      w.onchange = e => { const id = e.target.dataset.pst; if (id) { const p = getProp(id); if (p) { saveProp({ ...p, status: +e.target.value }); renderPipeline(); } } };
      w.onclick = e => {
        const t = e.target.closest("button"); if (!t) return;
        if (t.dataset.pf) { S.ui.pf = t.dataset.pf; save(); renderPipeline(); }
        else if (t.dataset.an) analyzeProp(t.dataset.an);
      };
    } else if (sub === "dd") {
      renderDD();
      w.onchange = e => { const k = e.target.dataset.dd; if (k) { S.dd[k] = e.target.checked; save(); const open = $$("details", w).map(d => d.open); renderDD(); $$("details", w).forEach((d, i) => d.open = open[i]); } };
    } else if (sub === "team") {
      renderTeam();
      w.onclick = e => {
        const t = e.target.closest("button"); if (!t) return;
        if (t.dataset.role) { S.t5.role = +t.dataset.role; }
        else if (t.id === "addCand") { S.t5.cands[S.t5.role].push({ name: "", s: [3, 3, 3, 3], flag: false, note: "" }); }
        else if (t.dataset.cdel) { S.t5.cands[S.t5.role].splice(+t.dataset.cdel, 1); }
        else if (t.dataset.score) { const [i, j, x] = t.dataset.score.split("-").map(Number); S.t5.cands[S.t5.role][i].s[j] = x; }
        else return;
        save(); renderTeam();
      };
      w.onchange = e => { const k = e.target.dataset.c; if (!k) return; const [i, f] = k.split("-"), c = S.t5.cands[S.t5.role][+i]; if (f === "name") c.name = e.target.value; else if (f === "flag") c.flag = e.target.checked; save(); renderTeam(); };
    }
  }
  if (r === "market") {
    const w = $("#mwrap");
    {
      renderMarket();
      w.onclick = e => {
        const t = e.target.closest("button"); if (!t) return;
        if (t.dataset.loc) S.t2.loc = +t.dataset.loc;
        else if (t.dataset.ms) { const [r2, x] = t.dataset.ms.split("-").map(Number); S.t2.scores[S.t2.loc][r2] = x; }
        else if (t.id === "mClear") { S.t2.scores = [0, 1, 2].map(() => MARKET_METRICS.map(() => 3)); S.t2.example = false; }
        else return;
        save(); renderMarket();
      };
      w.onchange = e => { const t = e.target; if (t.dataset.w) { S.t2.weights[+t.dataset.w] = +t.value; save(); renderMarket(); } else if (t.id === "locName") { S.t2.names[S.t2.loc] = t.value; save(); renderMarket(); } };
      w.oninput = e => { if (e.target.id === "locNote") { S.t2.notes[S.t2.loc] = e.target.value; save(); } };
    }
  }
  if (r === "backup") {
    $("#bkCopy").onclick = () => { const t = $("#bkOut"), manual = () => { t.select(); toast("סמנתי, העתק ידנית"); }; try { navigator.clipboard.writeText(t.value).then(() => toast("הועתק"), manual); } catch (e) { manual(); } };
    $("#bkLoad").onclick = () => { const m = $("#bkMsg"); try { const o = JSON.parse($("#bkIn").value); if (!o || typeof o !== "object" || !o.tasks) throw 0; S = deepMerge(defaults(), o); save(); m.textContent = "שוחזר"; m.style.color = "var(--green)"; } catch (e) { m.textContent = "הקוד לא תקין. הדבק את כל הטקסט מהייצוא."; m.style.color = "var(--red)"; } };
    confirmBtn("bkReset", "מחק את כל ההתקדמות", () => { S = defaults(); save(); go("home"); toast("אופס"); });
  }
}

/* ===================== BOOT ===================== */
const h0 = (location.hash || "").slice(1);
go(validRoute(h0) ? h0 : (S.ui.route || "home"));
initStore();
</script>
